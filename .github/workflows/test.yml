# API-less checks only: nothing here calls a model, AWS, or needs a secret.
name: test
# Docs-only changes skip these checks; gitleaks still scans them. List paths
# one by one rather than "**.md": the learn prompts and skills are Markdown
# that the binary embeds and the plugin ships, and hack/gendocs's test
# checks docs/commands.md and docs/config.md. Keep the two lists the same.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/events.md"
      - "docs/github-app.md"
      - "docs/harnesses.md"
      - "docs/img/**"
      - "docs/import.md"
      - "docs/learning.md"
      - "docs/pr-credentials.md"
      - "docs/store.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CLAUDE.md"
      - "LICENSE"
      - "examples/**/README.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  pull_request:
    paths-ignore:
      - "docs/events.md"
      - "docs/github-app.md"
      - "docs/harnesses.md"
      - "docs/img/**"
      - "docs/import.md"
      - "docs/learning.md"
      - "docs/pr-credentials.md"
      - "docs/store.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CLAUDE.md"
      - "LICENSE"
      - "examples/**/README.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...
      # Releases build without cgo; only the TPM simulator tests use it.
      - run: CGO_ENABLED=0 go build ./...
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin and marketplace manifests
        run: |
          claude plugin validate .
          claude plugin validate .claude-plugin/marketplace.json
      # plugin.json is the Agent Plugins manifest Kiro installs as a power.
      - name: Both plugin manifests carry one version
        run: |
          claude="$(jq -r .version .claude-plugin/plugin.json)"
          agent="$(jq -r .version plugin.json)"
          if [ "$claude" != "$agent" ]; then
            echo ".claude-plugin/plugin.json is $claude but plugin.json is $agent"; exit 1
          fi

  # Lints the cask GoReleaser would publish, with the version release.yml pins.
  cask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: GoReleaser version from release.yml
        id: goreleaser
        run: |
          v="$(yq '.jobs.release.steps[] | select(.uses == "goreleaser/goreleaser-action*") | .with.version' .github/workflows/release.yml)"
          test -n "$v" && echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ steps.goreleaser.outputs.version }}
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ steps.goreleaser.outputs.version }}
          args: release --snapshot --clean
      - name: brew style on the rendered casks
        run: |
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          cp dist/homebrew/Casks/recall.rb dist/homebrew/Casks/recall-github-app.rb "$RUNNER_TEMP/tap/Casks/"
          # ubuntu-latest ships Homebrew here, off PATH.
          /home/linuxbrew/.linuxbrew/bin/brew style "$RUNNER_TEMP/tap/Casks/recall.rb" "$RUNNER_TEMP/tap/Casks/recall-github-app.rb"
