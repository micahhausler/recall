# API-less checks only: nothing here calls a model, AWS, or needs a secret.
name: test
# Docs-only changes skip these checks; gitleaks still scans them. List paths
# one by one rather than "**.md": the learn prompts and skills are Markdown
# that the binary embeds and the plugin ships. Keep the two lists the same.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CLAUDE.md"
      - "LICENSE"
      - "config.example.toml"
      - "examples/**/README.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CLAUDE.md"
      - "LICENSE"
      - "config.example.toml"
      - "examples/**/README.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin and marketplace manifests
        run: |
          claude plugin validate .
          claude plugin validate .claude-plugin/marketplace.json

  # Lints the cask GoReleaser would publish, with the version release.yml pins.
  cask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: GoReleaser version from release.yml
        id: goreleaser
        run: |
          v="$(yq '.jobs.release.steps[] | select(.uses == "goreleaser/goreleaser-action*") | .with.version' .github/workflows/release.yml)"
          test -n "$v" && echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ steps.goreleaser.outputs.version }}
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ steps.goreleaser.outputs.version }}
          args: release --snapshot --clean
      - name: brew style on the rendered cask
        run: |
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          cp dist/homebrew/Casks/recall.rb "$RUNNER_TEMP/tap/Casks/"
          # ubuntu-latest ships Homebrew here, off PATH.
          /home/linuxbrew/.linuxbrew/bin/brew style "$RUNNER_TEMP/tap/Casks/recall.rb"
