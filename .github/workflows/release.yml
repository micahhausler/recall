# On a pushed v* tag: test, then goreleaser builds linux and macOS binaries,
# publishes the GitHub release, and commits the Homebrew cask to Casks/.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Tag matches the plugin versions
        run: |
          for manifest in .claude-plugin/plugin.json plugin.json; do
            want="v$(jq -r .version "$manifest")"
            if [ "$GITHUB_REF_NAME" != "$want" ]; then
              echo "tag $GITHUB_REF_NAME doesn't match $manifest version $want"; exit 1
            fi
          done
      - run: go vet ./...
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.3  # test.yml checks the config and cask against this version
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
