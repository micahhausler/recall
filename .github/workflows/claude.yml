# Runs Claude Code when the repository's owner tags @claude in an issue,
# a comment, or a review.
#
# This repo is public, so anyone can write a comment that contains the
# trigger phrase. The action itself refuses anyone without write access; the
# owner check below goes further and skips the job outright, so an outsider's
# comment starts nothing here.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Each event carries the association of whoever wrote the text that holds
    # the trigger phrase. For an issue that is the issue's author, so
    # assigning someone else's issue never runs Claude on what they wrote.
    if: |
      (github.event_name == 'issue_comment' && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && github.event.review.author_association == 'OWNER' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.issue.author_association == 'OWNER' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # lets Claude read CI results on pull requests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # checkout would otherwise leave the job's read-only token in a
          # git config file the Claude action doesn't clear, and every push
          # Claude makes would go out as that token and be refused.
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
