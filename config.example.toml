# recall config, layered TOML.
#
# Files: ~/.config/recall/config.toml, then every ~/.config/recall/config.d/*.toml
# in lexical order. A later file wins key by key: tables merge, a later scalar or
# array replaces an earlier one whole. $RECALL_CONFIG overrides the base path.
#
# `recall config set` writes only to config.d/90-set.local.toml, never to a file
# you edited. Drop-ins named *.local.toml are machine-local by convention;
# a dotfiles repo should sync config.d/*.toml except that pattern. `recall config show` prints the merged result with the file and line
# each value came from.

# This machine's name in archive keys and reports. Default: hostname -s.
# Set an alias such as "laptop" to keep the real hostname out of archive keys.
# Pin it before the first `recall init`: the reducer claim and every store
# record key on this name, and macOS hostnames drift.
host = "laptop-a"

[store]
# Where archives and analysis live: "s3" or "fs".
kind = "s3"
# fs only: the root directory. ~ and $HOME expand.
path = "~/recall-store"

[store.s3]
# AWS profile; empty means the default credential chain.
profile = "archive"
# AWS region; empty means the profile's region.
region = "us-west-2"
# An existing bucket's name. Empty: the bucket is named in your account
# regional namespace, <bucket_prefix>-<account id>-<region>-an, derived at
# run time so no account ID lives in config.
bucket = ""
# Prefix for the namespaced bucket name. Changing it after the first upload
# strands the old bucket's data under the old name.
bucket_prefix = "chat-archive"
# Optional endpoint override, for S3-compatible stores.
endpoint = ""
# Objects expire this many days after upload.
retention_days = 3650

[archive-chats]
# Complete weeks each run checks, so a missed run is caught up.
lookback = 4
# S3 Standard USD per GB-month, for `recall archive-chats estimate`.
price_per_gb = 0.023
# Replace secret-shaped tokens in each week's transcripts and the text files
# beside them (.jsonl, .json, .txt, .md) with [REDACTED:<kind>] as the tarball
# is built; the files on disk are never changed. It matches token shapes only:
# AWS access key IDs, GitHub and Slack tokens, sk- API keys, PEM private keys,
# bearer headers, and JWTs. A password in prose passes through, and what it
# replaces is gone from the archive for good, so it is off by default.
redact = false

# One table per harness. `enabled = false` in a later file turns one off.
# claude is on unless turned off; any other harness is on once its table
# exists. Known harnesses: claude, kiro. With claude off, learn.runner,
# learn.ledger, and learn.skills default to kiro's, and recall init declares
# recur jobs for the loop: Kiro's session-end hook kills every process it
# starts, so it can't run the background worker.
[harness.claude]
# Where this harness keeps transcripts. Its context file, CLAUDE.md, is
# read from this directory's parent.
source = "~/.claude/projects"

[harness.kiro]
# Kiro CLI's sessions: cli/<id>.jsonl (V2 engine) and
# <hash>/sess_<id>/messages.jsonl (v3 engine). Its context files, the
# steering directory with AGENTS.md, are read from this directory's parent.
source = "~/.kiro/sessions"

# A harness recall doesn't know by name reads its transcripts in the format
# of the known harness `format` names, from its own source, such as Claude
# Code run with CLAUDE_CONFIG_DIR set or an app that runs a harness CLI with
# its own config directory. It archives and maps under its own name, and
# adds no learn.targets entry and no runner.
# [harness.claude-work]
# format = "claude"
# source = "~/.claude-work/projects"

# format = "events" reads recall's own normalized events, one session per
# <id>.jsonl directly in source, which defaults to
# ~/.local/state/recall/import/<name>/sessions. Its paths name another
# machine and are never looked up here. analysis, hits, reviews, ledger,
# learn, and evidence-* are recall's own store prefixes and can't name a
# harness.
# [harness.chat]
# format = "events"

# An import: recall runs import.command (required; the program, then its
# arguments, without a shell; a bare name is looked up on PATH) with the
# request in RECALL_IMPORT_INFO, and stores the sessions it writes under
# the harness's source. import.timeout bounds one run (default "10m").
# `recall import` runs it. See docs/harnesses.md.
# [harness.chat.import]
# command = ["chat-history", "--workspace", "all"]
# timeout = "10m"

# Recurring jobs are the opt-in alternative to the session hooks, for a
# machine that wants a fixed schedule or whose sessions never end cleanly.
[recur]
# Crontab marker and launchd label prefix.
prefix = "recall.recur"
# NAME=value for every job; $HOME and ~ expand at run time.
env = ["PATH=$HOME/go/bin:/usr/local/bin:/usr/bin:/bin"]
# The timezone cron schedules use on Linux, written as CRON_TZ at the top of
# the generated block. launchd always uses the Mac's timezone.
cron_tz = "America/Los_Angeles"

# One table per job: five cron fields and a shell command.
# `enabled = false` in a later file turns off a job an earlier one declared.
[recur.jobs.archive-chats]
schedule = "0 12 * * 1"
command = "recall archive-chats run"

# An import that fetches from a service runs from a job on the one machine
# whose drop-in names its import.command; a bare-named plugin, and what it
# runs, must be on recur.env's PATH. The archive and the map need it at
# least weekly. An import of a file you download runs by hand instead.
# [recur.jobs.import-chat]
# schedule = "0 6 * * *"
# command = "recall import chat"

[learn]
# The harness CLI model calls go through, in headless mode: "claude"
# (claude -p) or "kiro" (kiro-cli chat --no-interactive). Never an API
# client, so existing auth works unchanged. Kiro saves every headless run as
# a session; recall deletes each one it starts. Kiro trusts a tool on any
# path, so it can't confine edits to worktrees: learn apply through kiro
# runs with no tools, and recall writes the files the model returns.
# Default: "claude", or "kiro" with harness.claude off.
runner = "claude"
# The model that reads one session (map), and the model that folds a window
# of observations into proposals (reduce). Measured on real sessions, haiku
# missed plain corrections that sonnet caught, so the map defaults to sonnet
# (a long session costs a few cents). With runner = "kiro" both default to
# "auto"; `kiro-cli chat --list-models` lists the IDs Kiro accepts. An
# alias like "sonnet" follows the family's newest release; a full ID like
# "claude-sonnet-5-5" pins one version. Either way, each observation, rule
# hit, reduce, replay, and apply records the model ID that answered.
map_model = "sonnet"
reduce_model = "opus"
# The effort each model runs at, from the runner's own levels: "low",
# "medium", "high", "xhigh", or "max" for claude, and those plus "none" for
# kiro, where the model decides which levels it honors. Unset leaves the
# harness default in charge, which differs by model and harness release and
# follows CLAUDE_CODE_EFFORT_LEVEL and the harness's own settings, so two
# runs of one config can think at different depths. Set, the runner passes
# --effort, which in kiro holds for that run only, and claude ignores
# CLAUDE_CODE_EFFORT_LEVEL, which would outrank the flag. Replays run at
# map_effort. map_effort is part of each session's fingerprint, so changing
# it maps every session again. A level the runner doesn't take fails at
# config load. Default: unset.
# map_effort = "high"
# reduce_effort = "high"
# How many sessions the map observes at once, each its own headless harness
# run, 1 to 32. More finishes sooner until the harness's rate limits push back.
map_workers = 4
# The context files rules live in; bullets in them become ledger entries.
# Unset: each enabled harness's own file, ~/.claude/CLAUDE.md for claude and
# ~/.kiro/steering/AGENTS.md for kiro.
targets = ["~/.claude/CLAUDE.md", "~/.kiro/steering/AGENTS.md"]
# Checkouts whose own context files a lesson may land in when every session
# behind it ran in that repo: its CLAUDE.md, .claude/CLAUDE.md, or AGENTS.md,
# path-scoped rules under .claude/rules, and a directory's own CLAUDE.md.
# Only files git tracks count, so a checkout at ~ skips the untracked and
# ignored context files under it.
# recall never proposes a change to a repo that isn't listed here, since a
# pull request there may be read by other people. Default: none.
repos = ["~/src/project"]
# A directory inside a private git checkout you own that holds your repo notes: one
# file of rules per repo recall doesn't change, at <repo_notes>/<host>/<path>.md,
# keyed by that repo's origin. A lesson every session of which ran in one
# unlisted repo with an origin lands in its notes, by a review in the
# checkout that holds the directory. The plugin's SessionStart hook adds a
# repo's notes to Claude Code sessions that start in it; recall writes
# nothing to the repo itself. A directory outside a git checkout is an
# error, and config load refuses one under a keep.public path, since repo
# notes describe other people's repos. Default: unset, which offers no repo
# notes.
# repo_notes = "~/src/notes/repo-notes"
# The rule ledger, a separate file, never comments in the context files
# (docs/learning.md). The store holds the authoritative copy for every
# machine that shares it: the reducer writes a new version there after each
# reduce and apply, every other machine treats this file as a cache of the
# newest store version, and a missing file is rebuilt.
ledger = "~/.local/state/recall/ledger.json"
# The candidate ledger: lessons your sessions have shown that aren't rules
# yet, each a group of alike observations, and which ones a proposal already
# used. It holds observation text, so it defaults to local state, on the one
# machine that runs the reduce.
candidates = "~/.local/state/recall/learn/candidates.json"
# A rule with no relevance for this many days is proposed for retirement.
retire_days = 90
# How far back the reduce reads observations, in days. 0, the default, reads
# retire_days back, and retirement always uses retire_days, so a wider window
# surfaces old lessons without retiring rules faster. For a one-off pass over
# every observation, run `recall learn reduce --window all`.
window_days = 0
# How many tokens one context file may cost, estimated at four characters a
# token. A new rule that would put its file over must name the rule it
# displaces, or the apply holds it back. 0, the default, is no budget; the
# reduce still shows what each file and each rule costs.
budget = 2000
# The model that applies reviewed proposals as edits. It gets file tools,
# confined to fresh worktrees, and no shell. With runner = "kiro" it defaults
# to "auto", like the map and reduce models.
apply_model = "sonnet"
# The effort the apply model runs at, like map_effort. Default: unset.
# apply_effort = "high"
# Where a proposed new skill lands, as <skills>/<name>/SKILL.md, and where a
# graduated script lands. Like every target, each must sit in a git checkout:
# apply stages its edits in a worktree of that checkout, never the live files.
# skills defaults to ~/.kiro/skills with harness.claude off.
skills = "~/.claude/skills"
bin = "~/bin"
# The harness settings file a graduated rule may be enforced in: a hook that
# runs a script under `bin` on matching tool calls, or a permission rule
# that denies a command or asks first. The binary makes the edit, never the
# model, and never adds an allow rule. It must sit in a git checkout and be
# tracked: when a generator writes your settings.json (so it is ignored),
# point this at the tracked layer the generator merges, like
# settings.base.json, and regenerate after merging a graduate. A graduate
# into a git-ignored settings file is held back. Unset: a graduated global
# rule is a script the agent has to remember to run. A rule in a repo's own
# context file graduates into that repo's .claude/settings.json either way,
# when every cited session ran there.
settings = "~/.claude/settings.json"
# Where an applied change goes for review: "pr" pushes a branch to origin and
# opens a pull request with gh; "branch" leaves the branch in the checkout,
# which works with any git host or none. Either way the change is one commit
# per proposal, so you can drop one before merging; after a merge, a proposal
# whose text did not land is recorded as rejected.
review = "pr"
# A shell command run in each changed worktree before commit, with the staged
# diff on stdin; a nonzero exit holds that repo's change back, staged in its
# worktree. For example: "gitleaks stdin --redact --no-banner".
check = ""
# A new rule or skill must cite at least one observation that quotes words
# you typed, checked by the binary against the session. Tool output and
# assistant prose reach the map too; with this on, they can support a
# proposal but can't be its only evidence. false lets them stand alone.
require_owner_evidence = true
# Let a new rule rest on repeats alone when the binary counted the same
# thing in at least this many sessions: the same opening actions, or the same
# tool failure, keyed by the tool and its normalized error text and counted
# across sessions. Repeats are tool-derived evidence, counted from tool
# calls, never words you typed, and proposals label them as such. Expected
# nonzero exits never count, and the map never sees them as failures: a grep
# or rg that matched nothing, a diff that found differences, a false test.
# 0, the default, counts no failures and keeps require_owner_evidence as the
# only gate for a new rule.
repeat_evidence_sessions = 0
# Test a proposed rule against the moment that earned it, with and without
# the rule, and hold back a rule that changes nothing. A replay is one
# tool-less model call; it executes nothing. Off by default, since each
# replay costs a call. See docs/learning.md#replay.
replay = false
# Evidence from outside the chat, read by `recall learn map` with no model
# call. "github" reads review comments and failed checks on pull requests in
# the learn.repos origins whose commits carry the agent's co-author trailer,
# through the gh CLI. Comments and failures are tool-derived evidence, never
# owner-typed unless you (the login gh is authenticated as) wrote the
# comment. The session-end hook worker scans each source at most once a day,
# like the archive step; a map you run by hand always scans. Empty, the
# default, reads none.
evidence = ["github"]
# The commit trailer that marks a pull request as agent-authored to an
# evidence source. Set it when your harness writes a different trailer, or
# attribution is off and your commits carry your own marker. With
# harness.claude off it defaults to "Co-Authored-By: Kiro"; Kiro writes no
# trailer of its own, so add a steering rule telling it to end each commit
# message with one.
evidence_trailer = "Co-Authored-By: Claude"

[hooks]
# What the plugin's session-end hook does in the background when a session
# ends: the default way to run the loop, with no cron job or LaunchAgent.
# Nothing recall installs runs at session start. All default to off, so
# nothing runs until `recall init` turns them on. A step never runs twice:
# the hook skips a step an enabled recur job's command already runs
# ("recall archive-chats run", "recall learn map", "recall learn run"),
# and init applies the same test when it decides which keys to set.
# Observe sessions that have been quiet for six hours, with the map model.
map = true
# Upload missing weeks to the store, at most once a day.
archive = true
# Run rules sync, the reduce, and the apply this many days apart; 0 never.
# `recall init` sets this only on the first machine to init against a store:
# that init records the host under learn/reducer in the store, and a later
# init on another machine sees the claim and leaves the reduce off, so one
# store gets one reducer and no duplicate proposals.
learn_every = 7

[review]
# Logins to assign each pull request the pr publisher opens, so it shows up
# under "Assigned to you". It applies with or without a credential command.
# A login the forge won't assign is a warning; the pull request stays open.
# Unset: no one is assigned.
assignees = ["you"]

[review.credentials]
# A command that supplies a credential for each repository the pr publisher
# and the github evidence source touch, in place of whatever gh is signed in
# as: a bot opens the pull request, and you review and approve it as
# yourself. recall names the repository it wants in RECALL_EXEC_INFO and reads a
# token, and optionally an expiry, a commit identity, and your login, from
# its stdout (docs/pr-credentials.md). When it names your login, each pull request asks
# you for review. The program and its arguments, run without a shell.
# With a command set, a repository it can't cover fails; recall never falls
# back to the machine's own login. Unset: the machine's gh login and git
# identity, as before.
command = ["recall-credential", "token"]
# How long one run of the command may take.
timeout = "30s"

[lint]
# Paths recall lint never reports. A side drop-in ignores the other side's
# context file, which sparse checkout deliberately keeps off this machine.
ignore = ["~/.claude/home.md"]

[keep]
# For the keep skill: where end-of-session lessons may land, one entry per
# file as "<path>: <what belongs there>". Unset: learn.targets.
targets = [
  "~/.claude/CLAUDE.md: preferences that hold everywhere",
]
# Where a lesson a script could enforce becomes a script.
bin = "~/bin"
# Anything under these paths is shared publicly; nothing personal goes there.
# learn apply marks a repo under one as public: its pull request carries no
# proposal text.
public = ["~/go/src/github.com/you"]

[extensions]
# The owner's own instructions, appended where an extension point loads:
# a recall skill by name (keep, recur, archive-chats, report-issue), or learn-reduce and
# learn-apply for the reduce and apply prompts. Files are read in order; a missing one is skipped with a
# warning. Keep personal steps here, in your own files, not in a fork.
# Like any array, a later config file replaces the list.
keep = ["~/.config/recall/keep.md"]
learn-reduce = ["~/.config/recall/reduce.md"]
