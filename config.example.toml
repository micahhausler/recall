# recall config: what `recall init` writes on a Claude Code machine with no config yet.
# config.reference.toml lists every key.

# Proposals stay on a local branch in each checkout; the default is "pr".
learn.review = "branch"
# Model calls go through the primary harness's CLI, and the models default to that runner's.
# learn.runner = "claude"
# learn.map_model = "sonnet"
# learn.reduce_model = "opus"
# learn.apply_model = "sonnet"
# Observe each session once it goes quiet, from the session-end hook; the default is false.
hooks.map = true
# Archive transcripts to the store weekly, from the same hook; the default is false.
hooks.archive = true
# Propose changes this many days apart, from the same hook; the default is 0, never.
hooks.learn_every = 7
