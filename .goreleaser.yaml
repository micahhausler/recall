# Release config: `goreleaser release` on a pushed v* tag (.github/workflows/release.yml).
# Binaries for linux and macOS only, plus a Homebrew cask in this repo's Casks/.
version: 2
project_name: recall

builds:
  - id: recall
    main: ./cmd/recall
    binary: recall
    env: &env [CGO_ENABLED=0]
    goos: &goos [linux, darwin]
    goarch: &goarch [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags: &flags [-trimpath]
    ldflags: &ldflags
      - -s -w -X github.com/micahhausler/recall/internal/version.Version={{ .Version }}
  # The optional GitHub App credential command (docs/github-app.md).
  - id: recall-github-app
    main: ./cmd/recall-github-app
    binary: recall-github-app
    env: *env
    goos: *goos
    goarch: *goarch
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags: *flags
    ldflags: *ldflags

archives:
  - id: recall
    ids: [recall]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Commit time and a fixed owner on every entry, so an archive's checksum
    # depends only on the commit, not on who built it or when they checked out.
    builds_info: &builds_info
      mtime: "{{ .CommitDate }}"
      owner: root
      group: root
    files:
      - src: LICENSE
        info: &fixed
          mtime: "{{ .CommitDate }}"
          owner: root
          group: root
      - src: README.md
        info: *fixed
  - id: recall-github-app
    ids: [recall-github-app]
    formats: [tar.gz]
    name_template: "recall-github-app_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info: *builds_info
    files:
      - src: LICENSE
        info: *fixed
      - src: docs/github-app.md
        info: *fixed

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

homebrew_casks:
  - name: recall
    ids: [recall]
    binaries: [recall]
    homepage: https://github.com/micahhausler/recall
    description: Turn your coding agent's history into memory
    license: Apache-2.0
    # The tap is this repo: Casks/recall.rb, committed to the default branch
    # after each release with the workflow's own token.
    directory: Casks
    commit_msg_template: "Update the Homebrew cask for {{ .Tag }}"
    repository:
      owner: micahhausler
      name: recall
    hooks:
      post:
        # The binary isn't notarized; without this macOS refuses to run it.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/recall"]
          end
  - name: recall-github-app
    ids: [recall-github-app]
    binaries: [recall-github-app]
    homepage: https://github.com/micahhausler/recall
    description: GitHub App installation tokens for recall's pull requests
    license: Apache-2.0
    directory: Casks
    commit_msg_template: "Update the Homebrew cask for {{ .Tag }}"
    repository:
      owner: micahhausler
      name: recall
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/recall-github-app"]
          end
